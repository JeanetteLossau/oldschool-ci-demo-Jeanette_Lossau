on: 
  push: 
    branches: [ "main" ] 

jobs: 
  build_and_test: 
    runs-on: ubuntu-latest 
    steps:
      - name: repo auschecken
        uses: actions/checkout@v4
    
      - name: Docker installieren
        run: |
          sudo apt-get update
          sudo apt-get upgrade
          sudo apt-get install -y docker.io
    
      - name: Docker Image bauen
        run: |
          docker build -t oldschool-ci-demo-Jeanette_Lossau
      
      - name: Container starten
        run: | 
          output=$(docker run oldschool-ci-demo-Jeanette_Lossau) 
          echo "$output" 
          if [ "$output" != "OldSchool GmbH –  automatischer Build erfolgreich! (Jeanette L.)" ]; then 
            echo "❌ Test fehlgeschlagen!" 
            exit 1 
          fi 
    
      - name: Ausgabe testen
        run: |
          echo "Test yay"
